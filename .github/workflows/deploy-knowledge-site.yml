name: Deploy EcoFarm Knowledge Site

on:
  push:
    branches:
      - main
    paths:
      - '10_knowledge_base_outputs/html_knowledge_site/**'
      - '.github/workflows/deploy-knowledge-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out archive
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static knowledge-site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./10_knowledge_base_outputs/html_knowledge_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
