# EcoFarm crop suitability catalogue
# ---------------------------------------------------------------------------
# HONESTY NOTE (governed by the archive):
# These are working agronomic thresholds compiled for the pilot decision engine.
# They are NOT TNAU recommendations, are NOT field-validated for any individual
# plot, and carry review_status: unreviewed_pending_agronomist.
# Every value here is presented in the UI together with that status.
# Do not silently upgrade these numbers into official guidance.
#
# Units: pH dimensionless, ec_ds_m soil EC in dS/m, duration_days whole days,
# water_mm approximate seasonal crop water requirement.
# water_need_level: 1 very_low | 2 low | 3 medium | 4 high | 5 very_high
# tolerance scores 0..1 per farmer objective.

catalogue_version: "crop-catalogue-2026.11.0"
review_status: "unreviewed_pending_agronomist"
limitation_note: >-
  Threshold values are working defaults compiled for the pilot decisions engine.
  They are not TNAU recommendations, are not calibrated to a specific plot or
  soil series, and must be reviewed by a qualified agronomist before any field use.

crops:
  - id: groundnut
    name_en: Groundnut
    local_names: { ta: "நிலக்கடலை" }
    category: oilseed
    water_need_level: 2
    water_mm: [400, 600]
    rainfed_suitable: true
    assured_irrigation_required: false
    duration_days: [100, 120]
    seasons:
      - { id: adipattam, name: "Adipattam (Apr-Jul)", months: [4, 5, 6, 7] }
      - { id: margazhi, name: "Margazhi pattam (Oct-Jan)", months: [10, 11, 12, 1] }
    soil:
      textures: [red, sandy, loam]
      ph_range: [5.5, 7.5]
      drainage: well_drained
      ec_tolerance_ds_m: 2.0
    cost_level: 3
    labour_level: 3
    objective_scores:
      water_conservation: 0.85
      lower_input_cost: 0.6
      timing_flexibility: 0.6
      household_food: 0.45
      market_sale: 0.75
      risk_reduction: 0.7
      fodder: 0.4
    objective_notes:
      market_sale: "Groundnut is a listed major Namakkal crop with established local trade."
      risk_reduction: "Rainfed groundnut establishment is the archive's primary field-research hypothesis, not a validated advantage."
    key_risks:
      - "Rainfed establishment depends on received rainfall; the engine holds no approved weather source."
      - "Pod yield is sensitive to moisture stress at pegging and pod-filling."
    guidance_reference: tnau_crop_production_guide
    prevalence_namakkal: major

